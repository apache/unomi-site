<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Line chart of cumulative unique contributors from Unomi 1 through 3.1">
  <defs>
    <style>
  svg {
    --unomi-primary: #6d5ce7;
    --unomi-primary-dark: #5a48c9;
    --unomi-primary-light: #ede9fe;
    --unomi-primary-subtle: #f5f3ff;
    --unomi-accent: #00cec9;
    --unomi-accent-dark: #0d9488;
    --unomi-hero-accent: #a78bfa;
    --unomi-text: #1e293b;
    --unomi-text-muted: #64748b;
    --unomi-white: #ffffff;
    --unomi-bg-soft: #f8fafc;
    --unomi-border: #e2e8f0;
    --unomi-success: #059669;
    --unomi-success-bg: #ecfdf5;
    --unomi-amber: #d97706;
    --unomi-amber-bg: #fef3c7;
    --unomi-info: #2563eb;
    --unomi-info-bg: #dbeafe;
    font-family: Inter, system-ui, sans-serif;
  }
  @keyframes grow-bar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes dash-flow { to { stroke-dashoffset: -20; } }
  @keyframes pulse-dot { 0%,100%{opacity:.7;r:5} 50%{opacity:1;r:7} }
  .bar { transform-box: fill-box; transform-origin: bottom; animation: grow-bar 0.9s ease-out both; }
  .fade { animation: fade-up 0.7s ease-out both; }
  .flow { stroke-dasharray: 5 4; animation: dash-flow 1.8s linear infinite; }
  .dot { animation: pulse-dot 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .bar,.fade,.flow,.dot { animation: none !important; }
  }
</style>
    <linearGradient id="areaFill" x1="0" y1="100" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6d5ce7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6d5ce7" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="840" height="400" rx="20" fill="var(--unomi-bg-soft)"/>
  <text class="fade" x="40" y="36" fill="var(--unomi-text)" font-size="18" font-weight="700">Cumulative contributors</text>
  <text class="fade" style="animation-delay:.08s" x="40" y="58" fill="var(--unomi-text-muted)" font-size="12">Unique git authors through each release tag (name-based; aliases not merged)</text>
  <line x1="80" y1="300" x2="760" y2="300" stroke="var(--unomi-border)" stroke-width="1.5"/>
  <polygon class="fade" style="animation-delay:.15s" points="120,300 120,220.0 300,153.3 480,140.0 660,120.0 660,300" fill="url(#areaFill)"/>
  <polyline class="fade flow" style="animation-delay:.2s" points="120,220.0 300,153.3 480,140.0 660,120.0" fill="none" stroke="var(--unomi-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <g class="fade" style="animation-delay:0.20s">
    <circle class="dot" style="animation-delay:0.0s" cx="120" cy="220.0" r="6" fill="var(--unomi-primary)"/>
    <text x="120" y="204.0" text-anchor="middle" fill="var(--unomi-primary-dark)" font-size="16" font-weight="800">62</text>
    <text x="120" y="328" text-anchor="middle" fill="var(--unomi-text)" font-size="13" font-weight="700">Unomi 1</text>
    <text x="120" y="346" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">2,255 commits</text>
  </g>
  <g class="fade" style="animation-delay:0.32s">
    <circle class="dot" style="animation-delay:0.3s" cx="300" cy="153.3" r="6" fill="var(--unomi-primary)"/>
    <text x="300" y="137.3" text-anchor="middle" fill="var(--unomi-primary-dark)" font-size="16" font-weight="800">72</text>
    <text x="300" y="328" text-anchor="middle" fill="var(--unomi-text)" font-size="13" font-weight="700">Unomi 2</text>
    <text x="300" y="346" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">2,657 commits</text>
  </g>
  <g class="fade" style="animation-delay:0.44s">
    <circle class="dot" style="animation-delay:0.6s" cx="480" cy="140.0" r="6" fill="var(--unomi-primary)"/>
    <text x="480" y="124.0" text-anchor="middle" fill="var(--unomi-primary-dark)" font-size="16" font-weight="800">74</text>
    <text x="480" y="328" text-anchor="middle" fill="var(--unomi-text)" font-size="13" font-weight="700">Unomi 3.0</text>
    <text x="480" y="346" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">2,682 commits</text>
  </g>
  <g class="fade" style="animation-delay:0.56s">
    <circle class="dot" style="animation-delay:0.9s" cx="660" cy="120.0" r="6" fill="var(--unomi-primary)"/>
    <text x="660" y="104.0" text-anchor="middle" fill="var(--unomi-primary-dark)" font-size="16" font-weight="800">77</text>
    <text x="660" y="328" text-anchor="middle" fill="var(--unomi-text)" font-size="13" font-weight="700">Unomi 4.0</text>
    <text x="660" y="346" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">2,769 commits</text>
  </g>
  <text class="fade" style="animation-delay:.8s" x="40" y="375" fill="var(--unomi-text-muted)" font-size="12">Steady community growth across a decade - 77 authors and 2,769 commits on master ancestry.</text>
</svg>
