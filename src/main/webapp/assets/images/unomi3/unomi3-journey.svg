<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Apache Unomi 4 journey from 2.x platform foundation to 4.0 product features">
  <defs>
<style>
  svg {
    --unomi-primary: #6d5ce7;
    --unomi-primary-dark: #5a48c9;
    --unomi-primary-light: #ede9fe;
    --unomi-primary-subtle: #f5f3ff;
    --unomi-accent: #00cec9;
    --unomi-hero-accent: #a78bfa;
    --unomi-text: #1e293b;
    --unomi-text-muted: #64748b;
    --unomi-white: #ffffff;
    --unomi-bg-soft: #f8fafc;
    --unomi-border: #e2e8f0;
    --unomi-success: #059669;
    --unomi-success-bg: #ecfdf5;
    --unomi-amber: #d97706;
    --unomi-amber-bg: #fef3c7;
    --unomi-info: #2563eb;
    --unomi-info-bg: #dbeafe;
    --unomi-on-dark: rgba(255,255,255,.85);
    font-family: Inter, system-ui, sans-serif;
  }
  @keyframes dash-flow { to { stroke-dashoffset: -24; } }
  @keyframes pulse-soft { 0%,100%{opacity:.55} 50%{opacity:.9} }
  @keyframes float-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  @keyframes glow { 0%,100%{filter:drop-shadow(0 0 4px rgba(109,92,231,.35))} 50%{filter:drop-shadow(0 0 10px rgba(109,92,231,.55))} }
  @keyframes dot-move { 0%{offset-distance:0%;opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
  .flow { stroke-dasharray: 6 5; animation: dash-flow 1.6s linear infinite; }
  .pulse { animation: pulse-soft 3s ease-in-out infinite; }
  .float { animation: float-y 3.2s ease-in-out infinite; }
  .glow { animation: glow 3s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .flow,.pulse,.float,.glow { animation: none !important; }
  }
</style>

    <linearGradient id="j-bg" x1="0" y1="0" x2="840" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--unomi-primary-subtle)"/>
      <stop offset="1" stop-color="var(--unomi-bg-soft)"/>
    </linearGradient>
  </defs>
  <rect width="840" height="280" rx="20" fill="url(#j-bg)"/>
  <text x="40" y="42" fill="var(--unomi-text)" font-size="18" font-weight="700">Apache Unomi 4 — release journey</text>
  <text x="40" y="64" fill="var(--unomi-text-muted)" font-size="13">One major story: platform (3.0) + product leap (4.0)</text>

  <!-- spine -->
  <line x1="80" y1="160" x2="760" y2="160" stroke="var(--unomi-primary)" stroke-width="3" class="flow" opacity=".45"/>

  <!-- 2.x -->
  <g class="float">
    <rect x="60" y="110" width="150" height="100" rx="16" fill="var(--unomi-white)" stroke="var(--unomi-border)" stroke-width="1.5"/>
    <text x="135" y="142" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="12" font-weight="600">LAST 2.x</text>
    <text x="135" y="168" text-anchor="middle" fill="var(--unomi-text)" font-size="20" font-weight="700">2.7</text>
    <text x="135" y="190" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">Java 11 · ES7</text>
  </g>

  <!-- 3.0 -->
  <g class="float" style="animation-delay:.3s">
    <rect x="290" y="100" width="180" height="120" rx="18" fill="var(--unomi-primary)" class="glow"/>
    <text x="380" y="132" text-anchor="middle" fill="var(--unomi-on-dark)" font-size="12" font-weight="600">FOUNDATION</text>
    <text x="380" y="160" text-anchor="middle" fill="var(--unomi-white)" font-size="22" font-weight="700">3.0</text>
    <text x="380" y="186" text-anchor="middle" fill="var(--unomi-on-dark)" font-size="11">Karaf 4.4 · ES9 · Java 17+ min</text>
    <text x="380" y="204" text-anchor="middle" fill="var(--unomi-on-dark)" font-size="11">persistence clustering</text>
  </g>

  <!-- 4.0 -->
  <g class="float" style="animation-delay:.6s">
    <rect x="560" y="90" width="220" height="140" rx="18" fill="var(--unomi-white)" stroke="var(--unomi-accent)" stroke-width="2.5"/>
    <rect x="560" y="90" width="220" height="36" rx="18" fill="var(--unomi-accent)"/>
    <rect x="560" y="108" width="220" height="18" fill="var(--unomi-accent)"/>
    <text x="670" y="114" text-anchor="middle" fill="var(--unomi-white)" font-size="12" font-weight="700">PRODUCT LEAP</text>
    <text x="670" y="150" text-anchor="middle" fill="var(--unomi-text)" font-size="22" font-weight="700">3.1</text>
    <text x="670" y="174" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">Multi-tenancy · OpenSearch</text>
    <text x="670" y="192" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">Tasks · V2 compat · unit harness</text>
    <text x="670" y="212" text-anchor="middle" fill="var(--unomi-success)" font-size="11" font-weight="600">current stable</text>
  </g>

  <!-- arrows labels -->
  <text x="245" y="150" text-anchor="middle" fill="var(--unomi-primary)" font-size="11" font-weight="600">upgrade</text>
  <text x="510" y="150" text-anchor="middle" fill="var(--unomi-accent)" font-size="11" font-weight="600">+ features</text>
</svg>
