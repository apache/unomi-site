<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Unomi 3: Elasticsearch 9 and OpenSearch as dual persistence backends">
  <defs>
<style>
  svg {
    --unomi-primary: #6d5ce7;
    --unomi-primary-dark: #5a48c9;
    --unomi-primary-light: #ede9fe;
    --unomi-primary-subtle: #f5f3ff;
    --unomi-accent: #00cec9;
    --unomi-hero-accent: #a78bfa;
    --unomi-text: #1e293b;
    --unomi-text-muted: #64748b;
    --unomi-white: #ffffff;
    --unomi-bg-soft: #f8fafc;
    --unomi-border: #e2e8f0;
    --unomi-success: #059669;
    --unomi-success-bg: #ecfdf5;
    --unomi-amber: #d97706;
    --unomi-amber-bg: #fef3c7;
    --unomi-info: #2563eb;
    --unomi-info-bg: #dbeafe;
    font-family: Inter, system-ui, sans-serif;
  }
  @keyframes dash-flow { to { stroke-dashoffset: -24; } }
  @keyframes pulse-soft { 0%,100%{opacity:.55} 50%{opacity:.9} }
  @keyframes float-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  @keyframes glow { 0%,100%{filter:drop-shadow(0 0 4px rgba(109,92,231,.35))} 50%{filter:drop-shadow(0 0 10px rgba(109,92,231,.55))} }
  .flow { stroke-dasharray: 6 5; animation: dash-flow 1.6s linear infinite; }
  .pulse { animation: pulse-soft 3s ease-in-out infinite; }
  .float { animation: float-y 3.2s ease-in-out infinite; }
  .glow { animation: glow 3s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .flow,.pulse,.float,.glow { animation: none !important; }
  }
</style>
  </defs>
  <rect width="840" height="380" rx="20" fill="var(--unomi-bg-soft)"/>
  <text x="40" y="40" fill="var(--unomi-text)" font-size="18" font-weight="700">One CDP, two search backends</text>
  <text x="40" y="62" fill="var(--unomi-text-muted)" font-size="13">Unomi 3 ships Elasticsearch 9 and first-class OpenSearch distributions</text>

  <g class="float">
    <rect x="40" y="100" width="340" height="220" rx="16" fill="var(--unomi-info-bg)" stroke="var(--unomi-info)" stroke-width="2"/>
    <text x="210" y="140" text-anchor="middle" fill="var(--unomi-info)" font-size="15" font-weight="700">Elasticsearch 9</text>
    <text x="210" y="168" text-anchor="middle" fill="var(--unomi-text)" font-size="12">persistence-elasticsearch</text>
    <text x="210" y="196" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="12">Java API Client (no HLRC)</text>
    <text x="210" y="220" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="12">org.apache.unomi.elasticsearch.*</text>
    <text x="210" y="252" text-anchor="middle" fill="var(--unomi-text)" font-size="12" font-weight="600">Default distribution</text>
    <text x="210" y="280" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">Pin e.g. 9.4.x in 3.1</text>
  </g>

  <g class="float" style="animation-delay:.4s">
    <rect x="460" y="100" width="340" height="220" rx="16" fill="var(--unomi-success-bg)" stroke="var(--unomi-success)" stroke-width="2"/>
    <text x="630" y="140" text-anchor="middle" fill="var(--unomi-success)" font-size="15" font-weight="700">OpenSearch</text>
    <text x="630" y="168" text-anchor="middle" fill="var(--unomi-text)" font-size="12">persistence-opensearch</text>
    <text x="630" y="196" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="12">Same PersistenceService SPI</text>
    <text x="630" y="220" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="12">org.apache.unomi.opensearch.*</text>
    <text x="630" y="252" text-anchor="middle" fill="var(--unomi-text)" font-size="12" font-weight="600">-Duse.opensearch=true</text>
    <text x="630" y="280" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">Migrate guide in the manual</text>
  </g>

  <path d="M390 210 H450" stroke="var(--unomi-primary)" stroke-width="3" class="flow"/>
  <circle cx="420" cy="210" r="18" fill="var(--unomi-primary)" class="glow"/>
  <text x="420" y="215" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">SPI</text>

</svg>
