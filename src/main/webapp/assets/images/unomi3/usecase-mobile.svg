<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Mobile app and beacons send events to Unomi for profiles, segments, and scores">
  <defs>
<style>
  svg {
    --unomi-primary: #6d5ce7;
    --unomi-primary-dark: #5a48c9;
    --unomi-primary-light: #ede9fe;
    --unomi-accent: #00cec9;
    --unomi-hero-accent: #a78bfa;
    --unomi-text: #1e293b;
    --unomi-text-muted: #64748b;
    --unomi-white: #ffffff;
    --unomi-bg-soft: #f8fafc;
    --unomi-border: #e2e8f0;
    --unomi-on-dark: rgba(255,255,255,.85);
    --unomi-success: #059669;
    font-family: Inter, system-ui, sans-serif;
  }
  @keyframes dash-flow { to { stroke-dashoffset: -24; } }
  @keyframes float-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .flow { stroke-dasharray: 6 5; animation: dash-flow 1.6s linear infinite; }
  .float { animation: float-y 3.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .flow,.float { animation: none !important; }
  }
</style>
</defs>
  <rect width="720" height="280" rx="20" fill="var(--unomi-bg-soft)"/>
  <text x="32" y="36" fill="var(--unomi-text)" font-size="15" font-weight="700">Mobile analytics</text>
  <text x="32" y="56" fill="var(--unomi-text-muted)" font-size="12">Apps &amp; beacons → Unomi → profiles, segments, scores</text>

  <g class="float">
    <rect x="40" y="100" width="130" height="56" rx="14" fill="var(--unomi-primary)"/>
    <text x="105" y="134" text-anchor="middle" fill="var(--unomi-white)" font-size="13" font-weight="600">Mobile App</text>
  </g>
  <g class="float" style="animation-delay:.25s">
    <rect x="40" y="180" width="130" height="48" rx="14" fill="var(--unomi-hero-accent)"/>
    <text x="105" y="209" text-anchor="middle" fill="var(--unomi-white)" font-size="13" font-weight="600">Beacons</text>
  </g>
  <line x1="180" y1="128" x2="250" y2="150" stroke="var(--unomi-primary)" stroke-width="2" class="flow"/>
  <line x1="180" y1="204" x2="250" y2="170" stroke="var(--unomi-hero-accent)" stroke-width="2" class="flow"/>

  <g class="float" style="animation-delay:.35s">
    <rect x="260" y="110" width="200" height="90" rx="16" fill="var(--unomi-white)" stroke="var(--unomi-primary)" stroke-width="2"/>
    <text x="360" y="150" text-anchor="middle" fill="var(--unomi-text)" font-size="14" font-weight="700">Apache Unomi</text>
    <text x="360" y="174" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="12">Auth + Events (REST)</text>
  </g>

  <line x1="470" y1="155" x2="520" y2="155" stroke="var(--unomi-accent)" stroke-width="2" class="flow"/>

  <g class="float">
    <rect x="530" y="90" width="150" height="40" rx="12" fill="var(--unomi-accent)"/>
    <text x="605" y="115" text-anchor="middle" fill="var(--unomi-white)" font-size="12" font-weight="600">Profiles</text>
  </g>
  <g class="float" style="animation-delay:.2s">
    <rect x="530" y="142" width="150" height="40" rx="12" fill="var(--unomi-primary)"/>
    <text x="605" y="167" text-anchor="middle" fill="var(--unomi-white)" font-size="12" font-weight="600">Segments</text>
  </g>
  <g class="float" style="animation-delay:.4s">
    <rect x="530" y="194" width="150" height="40" rx="12" fill="var(--unomi-primary-dark)"/>
    <text x="605" y="219" text-anchor="middle" fill="var(--unomi-white)" font-size="12" font-weight="600">Scoring</text>
  </g>
</svg>
