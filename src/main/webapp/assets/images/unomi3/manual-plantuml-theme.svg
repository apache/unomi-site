<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Unomi 3 manual: AsciiDoc with PlantUML sources builds into a branded HTML manual with diagrams">
  <defs>
<style>
  svg {
    --unomi-primary: #6d5ce7;
    --unomi-primary-dark: #5a48c9;
    --unomi-primary-light: #ede9fe;
    --unomi-primary-subtle: #f5f3ff;
    --unomi-accent: #00cec9;
    --unomi-hero-accent: #a78bfa;
    --unomi-text: #1e293b;
    --unomi-text-muted: #64748b;
    --unomi-white: #ffffff;
    --unomi-bg-soft: #f8fafc;
    --unomi-border: #e2e8f0;
    --unomi-success: #059669;
    --unomi-success-bg: #ecfdf5;
    --unomi-info: #2563eb;
    --unomi-info-bg: #dbeafe;
    --term-bg: #0f172a;
    --term-muted: #94a3b8;
    --term-ok: #34d399;
    font-family: Inter, system-ui, sans-serif;
  }
  @keyframes dash-flow { to { stroke-dashoffset: -24; } }
  @keyframes pulse-soft { 0%,100%{opacity:.55} 50%{opacity:.9} }
  @keyframes float-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  @keyframes glow { 0%,100%{filter:drop-shadow(0 0 4px rgba(109,92,231,.35))} 50%{filter:drop-shadow(0 0 10px rgba(109,92,231,.55))} }
  .flow { stroke-dasharray: 6 5; animation: dash-flow 1.6s linear infinite; }
  .pulse { animation: pulse-soft 3s ease-in-out infinite; }
  .float { animation: float-y 3.2s ease-in-out infinite; }
  .glow { animation: glow 3s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .flow,.pulse,.float,.glow { animation: none !important; }
  }
</style>
  </defs>

  <rect width="840" height="400" rx="20" fill="var(--unomi-bg-soft)"/>
  <text x="40" y="40" fill="var(--unomi-text)" font-size="18" font-weight="700">Manual as code</text>
  <text x="40" y="62" fill="var(--unomi-text-muted)" font-size="13">PlantUML in AsciiDoc | branded HTML/PDF | diagrams rebuild with the docs</text>

  <g>
    <rect x="40" y="88" width="310" height="270" rx="18" fill="var(--unomi-info-bg)" stroke="var(--unomi-info)" stroke-width="2"/>
    <text x="60" y="118" fill="var(--unomi-info)" font-size="14" font-weight="700">AsciiDoc source</text>
    <rect x="56" y="136" width="278" height="200" rx="12" fill="var(--term-bg)"/>
    <text x="72" y="162" fill="var(--unomi-accent)" font-size="11" font-family="ui-monospace, Menlo, monospace">[plantuml]</text>
    <text x="72" y="182" fill="var(--term-muted)" font-size="10" font-family="ui-monospace, Menlo, monospace">----</text>
    <text x="72" y="202" fill="var(--term-ok)" font-size="10" font-family="ui-monospace, Menlo, monospace">@startuml</text>
    <text x="72" y="220" fill="#e2e8f0" font-size="10" font-family="ui-monospace, Menlo, monospace">!include C4_Component.puml</text>
    <text x="72" y="238" fill="#e2e8f0" font-size="10" font-family="ui-monospace, Menlo, monospace">Container(unomi, "Unomi")</text>
    <text x="72" y="256" fill="#e2e8f0" font-size="10" font-family="ui-monospace, Menlo, monospace">Component(rest, "REST")</text>
    <text x="72" y="274" fill="var(--term-ok)" font-size="10" font-family="ui-monospace, Menlo, monospace">@enduml</text>
    <text x="72" y="294" fill="var(--term-muted)" font-size="10" font-family="ui-monospace, Menlo, monospace">----</text>
    <text x="72" y="318" fill="var(--unomi-hero-accent)" font-size="11" font-family="ui-monospace, Menlo, monospace">+ GraphViz | reviewable diffs</text>
  </g>

  <g>
    <path d="M 368 220 L 412 220" stroke="var(--unomi-primary)" stroke-width="2.5" stroke-linecap="round" class="flow"/>
    <path d="M 404 212 L 416 220 L 404 228" fill="var(--unomi-primary)" class="pulse"/>
    <text x="390" y="204" text-anchor="middle" fill="var(--unomi-primary-dark)" font-size="11" font-weight="600">build</text>
  </g>

  <g class="float">
    <rect x="430" y="88" width="370" height="270" rx="18" fill="var(--unomi-primary-light)" stroke="var(--unomi-primary)" stroke-width="2" class="glow"/>
    <text x="450" y="118" fill="var(--unomi-primary-dark)" font-size="14" font-weight="700">Branded manual</text>
    <rect x="450" y="136" width="330" height="198" rx="12" fill="var(--unomi-white)" stroke="var(--unomi-border)"/>
    <rect x="450" y="136" width="330" height="36" rx="12" fill="var(--unomi-primary)"/>
    <rect x="450" y="158" width="330" height="14" fill="var(--unomi-primary)"/>
    <text x="468" y="158" fill="#ffffff" font-size="11" font-weight="600">Apache Unomi 3.x | Documentation</text>
    <rect x="458" y="184" width="88" height="140" rx="8" fill="var(--unomi-primary-subtle)"/>
    <text x="468" y="204" fill="var(--unomi-primary-dark)" font-size="9" font-weight="700">Contents</text>
    <text x="468" y="222" fill="var(--unomi-text-muted)" font-size="8">What's new</text>
    <text x="468" y="238" fill="var(--unomi-text)" font-size="8" font-weight="600">Architecture</text>
    <text x="468" y="254" fill="var(--unomi-text-muted)" font-size="8">Migrations</text>
    <text x="468" y="270" fill="var(--unomi-text-muted)" font-size="8">Scheduler</text>
    <text x="468" y="286" fill="var(--unomi-text-muted)" font-size="8">Security</text>
    <rect x="560" y="184" width="100" height="64" rx="8" fill="var(--unomi-success-bg)" stroke="var(--unomi-success)"/>
    <circle cx="590" cy="208" r="10" fill="var(--unomi-success)" opacity=".85"/>
    <rect x="610" y="200" width="36" height="10" rx="3" fill="var(--unomi-success)" opacity=".5"/>
    <rect x="610" y="216" width="28" height="10" rx="3" fill="var(--unomi-success)" opacity=".35"/>
    <text x="610" y="238" fill="var(--unomi-success)" font-size="8" font-weight="600">C4 | PNG</text>
    <rect x="672" y="184" width="96" height="64" rx="8" fill="var(--unomi-info-bg)" stroke="var(--unomi-info)"/>
    <path d="M690 208 H 748 M 710 196 V 232" stroke="var(--unomi-info)" stroke-width="2" class="flow"/>
    <circle cx="700" cy="208" r="5" fill="var(--unomi-info)"/>
    <circle cx="748" cy="208" r="5" fill="var(--unomi-accent)"/>
    <text x="700" y="238" fill="var(--unomi-info)" font-size="8" font-weight="600">sequence</text>
    <text x="560" y="278" fill="var(--unomi-text)" font-size="11" font-weight="600">Inter | brand tokens</text>
    <text x="560" y="296" fill="var(--unomi-text-muted)" font-size="10">Responsive nav + TOC | PDF theme</text>
    <text x="560" y="314" fill="var(--unomi-primary-dark)" font-size="10" font-weight="600">62 PlantUML diagrams | text in git</text>
  </g>
</svg>
