<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="One Unomi cluster hosting isolated tenants for SaaS and agency deployments">
  <defs>
<style>
  svg {
    --unomi-primary: #6d5ce7;
    --unomi-primary-dark: #5a48c9;
    --unomi-primary-light: #ede9fe;
    --unomi-accent: #00cec9;
    --unomi-hero-accent: #a78bfa;
    --unomi-text: #1e293b;
    --unomi-text-muted: #64748b;
    --unomi-white: #ffffff;
    --unomi-bg-soft: #f8fafc;
    --unomi-border: #e2e8f0;
    --unomi-on-dark: rgba(255,255,255,.85);
    --unomi-success: #059669;
    font-family: Inter, system-ui, sans-serif;
  }
  @keyframes dash-flow { to { stroke-dashoffset: -24; } }
  @keyframes float-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .flow { stroke-dasharray: 6 5; animation: dash-flow 1.6s linear infinite; }
  .float { animation: float-y 3.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .flow,.float { animation: none !important; }
  }
</style>
</defs>
  <rect width="720" height="260" rx="20" fill="var(--unomi-bg-soft)"/>
  <text x="32" y="36" fill="var(--unomi-text)" font-size="15" font-weight="700">Multi-tenant / SaaS CDP</text>
  <text x="32" y="56" fill="var(--unomi-text-muted)" font-size="12">One cluster · many isolated tenants · public &amp; private API keys</text>

  <g class="float">
    <rect x="40" y="100" width="140" height="48" rx="12" fill="var(--unomi-primary)"/>
    <text x="110" y="130" text-anchor="middle" fill="var(--unomi-white)" font-size="12" font-weight="600">Customer A</text>
  </g>
  <g class="float" style="animation-delay:.2s">
    <rect x="40" y="160" width="140" height="48" rx="12" fill="var(--unomi-primary-dark)"/>
    <text x="110" y="190" text-anchor="middle" fill="var(--unomi-white)" font-size="12" font-weight="600">Customer B</text>
  </g>

  <line x1="190" y1="150" x2="250" y2="150" stroke="var(--unomi-primary)" stroke-width="2" class="flow"/>

  <g class="float" style="animation-delay:.3s">
    <rect x="260" y="90" width="200" height="120" rx="16" fill="var(--unomi-white)" stroke="var(--unomi-accent)" stroke-width="2.5"/>
    <text x="360" y="135" text-anchor="middle" fill="var(--unomi-text)" font-size="14" font-weight="700">Apache Unomi 4.0</text>
    <text x="360" y="160" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="12">Tenant isolation</text>
    <text x="360" y="182" text-anchor="middle" fill="var(--unomi-accent)" font-size="12" font-weight="600">API keys</text>
  </g>

  <line x1="470" y1="150" x2="530" y2="150" stroke="var(--unomi-accent)" stroke-width="2" class="flow"/>

  <g class="float">
    <rect x="540" y="100" width="140" height="40" rx="12" fill="var(--unomi-accent)"/>
    <text x="610" y="125" text-anchor="middle" fill="var(--unomi-white)" font-size="11" font-weight="600">Tenant A data</text>
  </g>
  <g class="float" style="animation-delay:.25s">
    <rect x="540" y="156" width="140" height="40" rx="12" fill="var(--unomi-primary)"/>
    <text x="610" y="181" text-anchor="middle" fill="var(--unomi-white)" font-size="11" font-weight="600">Tenant B data</text>
  </g>
</svg>
