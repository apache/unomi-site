<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Data flows into Apache Unomi via REST and out to personalization, scoring, and AI agents">
  <defs>
<style>
  svg {
    --unomi-primary: #6d5ce7;
    --unomi-primary-dark: #5a48c9;
    --unomi-primary-light: #ede9fe;
    --unomi-primary-subtle: #f5f3ff;
    --unomi-accent: #00cec9;
    --unomi-hero-accent: #a78bfa;
    --unomi-text: #1e293b;
    --unomi-text-muted: #64748b;
    --unomi-white: #ffffff;
    --unomi-bg-soft: #f8fafc;
    --unomi-border: #e2e8f0;
    --unomi-on-dark: rgba(255,255,255,.85);
    font-family: Inter, system-ui, sans-serif;
  }
  @keyframes dash-flow { to { stroke-dashoffset: -24; } }
  @keyframes float-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .flow { stroke-dasharray: 6 5; animation: dash-flow 1.6s linear infinite; }
  .float { animation: float-y 3.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .flow,.float { animation: none !important; }
  }
</style>
</defs>
  <rect width="920" height="260" rx="20" fill="var(--unomi-bg-soft)"/>
  <text x="40" y="36" fill="var(--unomi-text)" font-size="16" font-weight="700">How Apache Unomi works</text>
  <text x="40" y="56" fill="var(--unomi-text-muted)" font-size="12">Sources → REST API → profiles, segments, rules → actions</text>

  <!-- sources -->
  <g class="float">
    <rect x="40" y="90" width="100" height="44" rx="12" fill="var(--unomi-primary)"/>
    <text x="90" y="117" text-anchor="middle" fill="var(--unomi-white)" font-size="13" font-weight="600">Web</text>
  </g>
  <g class="float" style="animation-delay:.2s">
    <rect x="40" y="146" width="100" height="44" rx="12" fill="var(--unomi-primary-dark)"/>
    <text x="90" y="173" text-anchor="middle" fill="var(--unomi-white)" font-size="13" font-weight="600">Mobile</text>
  </g>
  <g class="float" style="animation-delay:.4s">
    <rect x="40" y="202" width="100" height="40" rx="12" fill="var(--unomi-hero-accent)"/>
    <text x="90" y="227" text-anchor="middle" fill="var(--unomi-white)" font-size="12" font-weight="600">CRM · IoT</text>
  </g>

  <line x1="150" y1="160" x2="210" y2="160" stroke="var(--unomi-primary)" stroke-width="2" class="flow"/>

  <!-- core -->
  <rect x="220" y="90" width="360" height="140" rx="18" fill="var(--unomi-white)" stroke="var(--unomi-primary)" stroke-width="2"/>
  <text x="400" y="122" text-anchor="middle" fill="var(--unomi-text)" font-size="14" font-weight="700">Apache Unomi</text>
  <text x="400" y="148" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="12">REST API · Processing</text>
  <text x="400" y="172" text-anchor="middle" fill="var(--unomi-text)" font-size="12">Profiles · Segmentation · Rules</text>
  <text x="400" y="200" text-anchor="middle" fill="var(--unomi-accent)" font-size="12" font-weight="600">Privacy &amp; consent</text>

  <line x1="590" y1="160" x2="650" y2="160" stroke="var(--unomi-accent)" stroke-width="2" class="flow"/>

  <!-- outputs -->
  <g class="float">
    <rect x="660" y="90" width="220" height="40" rx="12" fill="var(--unomi-accent)"/>
    <text x="770" y="115" text-anchor="middle" fill="var(--unomi-white)" font-size="13" font-weight="600">Personalization</text>
  </g>
  <g class="float" style="animation-delay:.25s">
    <rect x="660" y="142" width="220" height="40" rx="12" fill="var(--unomi-primary)"/>
    <text x="770" y="167" text-anchor="middle" fill="var(--unomi-white)" font-size="13" font-weight="600">Scoring · Export</text>
  </g>
  <g class="float" style="animation-delay:.5s">
    <rect x="660" y="194" width="220" height="40" rx="12" fill="var(--unomi-primary-dark)"/>
    <text x="770" y="219" text-anchor="middle" fill="var(--unomi-white)" font-size="13" font-weight="600">AI Agents</text>
  </g>
</svg>
