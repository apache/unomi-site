<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Grouped bar chart of unit and integration @Test methods from Unomi 1 through Unomi 4.0">
  <defs><style>
  svg {
    --unomi-primary: #6d5ce7;
    --unomi-primary-dark: #5a48c9;
    --unomi-primary-light: #ede9fe;
    --unomi-primary-subtle: #f5f3ff;
    --unomi-accent: #00cec9;
    --unomi-accent-dark: #0d9488;
    --unomi-hero-accent: #a78bfa;
    --unomi-text: #1e293b;
    --unomi-text-muted: #64748b;
    --unomi-white: #ffffff;
    --unomi-bg-soft: #f8fafc;
    --unomi-border: #e2e8f0;
    --unomi-success: #059669;
    --unomi-success-bg: #ecfdf5;
    --unomi-amber: #d97706;
    --unomi-amber-bg: #fef3c7;
    --unomi-info: #2563eb;
    --unomi-info-bg: #dbeafe;
    font-family: Inter, system-ui, sans-serif;
  }
  @keyframes grow-bar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes dash-flow { to { stroke-dashoffset: -20; } }
  @keyframes pulse-dot { 0%,100%{opacity:.7;r:5} 50%{opacity:1;r:7} }
  .bar { transform-box: fill-box; transform-origin: bottom; animation: grow-bar 0.9s ease-out both; }
  .fade { animation: fade-up 0.7s ease-out both; }
  .flow { stroke-dasharray: 5 4; animation: dash-flow 1.8s linear infinite; }
  .dot { animation: pulse-dot 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .bar,.fade,.flow,.dot { animation: none !important; }
  }
</style></defs>
  <rect width="840" height="420" rx="20" fill="var(--unomi-bg-soft)"/>
  <text class="fade" x="40" y="36" fill="var(--unomi-text)" font-size="18" font-weight="700">Unit and integration tests</text>
  <text class="fade" style="animation-delay:.08s" x="40" y="58" fill="var(--unomi-text-muted)" font-size="12">Approximate @Test method counts (JUnit annotations)</text>
  <text class="fade" style="animation-delay:.12s" x="40" y="78" fill="var(--unomi-text-muted)" font-size="11">Unomi 1: 11 unit / 25 IT classes  |  Unomi 2: 12 unit / 44 IT classes  |  Unomi 3: 15 unit / 43 IT classes  |  Unomi 4.0: 151 unit / 77 IT classes</text>
  <line x1="70" y1="320.0" x2="780" y2="320.0" stroke="var(--unomi-border)" stroke-width="1"/><text x="64" y="324.0" text-anchor="end" fill="var(--unomi-text-muted)" font-size="10">0</text><line x1="70" y1="265.0" x2="780" y2="265.0" stroke="var(--unomi-border)" stroke-width="1"/><text x="64" y="269.0" text-anchor="end" fill="var(--unomi-text-muted)" font-size="10">600</text><line x1="70" y1="210.0" x2="780" y2="210.0" stroke="var(--unomi-border)" stroke-width="1"/><text x="64" y="214.0" text-anchor="end" fill="var(--unomi-text-muted)" font-size="10">1,200</text><line x1="70" y1="155.0" x2="780" y2="155.0" stroke="var(--unomi-border)" stroke-width="1"/><text x="64" y="159.0" text-anchor="end" fill="var(--unomi-text-muted)" font-size="10">1,800</text><line x1="70" y1="100.0" x2="780" y2="100.0" stroke="var(--unomi-border)" stroke-width="1"/><text x="64" y="104.0" text-anchor="end" fill="var(--unomi-text-muted)" font-size="10">2,400</text>
  
  <g class="fade" style="animation-delay:0.10s">
    <rect class="bar" style="animation-delay:0.10s" x="100" y="316.9" width="36" height="3.1" rx="4" fill="var(--unomi-primary)"/>
    <rect class="bar" style="animation-delay:0.15s" x="142" y="308.3" width="36" height="11.7" rx="4" fill="var(--unomi-info)"/>
    <text x="118" y="308.9" text-anchor="middle" fill="var(--unomi-primary-dark)" font-size="11" font-weight="700">34</text>
    <text x="160" y="300.3" text-anchor="middle" fill="var(--unomi-info)" font-size="11" font-weight="700">128</text>
    <text x="139" y="344" text-anchor="middle" fill="var(--unomi-text)" font-size="13" font-weight="700">Unomi 1</text>
    <text x="139" y="362" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">1.9.1</text>
  </g>
  <g class="fade" style="animation-delay:0.22s">
    <rect class="bar" style="animation-delay:0.22s" x="280" y="316.1" width="36" height="3.8" rx="4" fill="var(--unomi-primary)"/>
    <rect class="bar" style="animation-delay:0.27s" x="322" y="302.3" width="36" height="17.7" rx="4" fill="var(--unomi-info)"/>
    <text x="298" y="308.1" text-anchor="middle" fill="var(--unomi-primary-dark)" font-size="11" font-weight="700">42</text>
    <text x="340" y="294.3" text-anchor="middle" fill="var(--unomi-info)" font-size="11" font-weight="700">193</text>
    <text x="319" y="344" text-anchor="middle" fill="var(--unomi-text)" font-size="13" font-weight="700">Unomi 2</text>
    <text x="319" y="362" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">2.7.0</text>
  </g>
  <g class="fade" style="animation-delay:0.34s">
    <rect class="bar" style="animation-delay:0.34s" x="460" y="311.7" width="36" height="8.3" rx="4" fill="var(--unomi-primary)"/>
    <rect class="bar" style="animation-delay:0.39s" x="502" y="302.3" width="36" height="17.7" rx="4" fill="var(--unomi-info)"/>
    <text x="478" y="303.7" text-anchor="middle" fill="var(--unomi-primary-dark)" font-size="11" font-weight="700">91</text>
    <text x="520" y="294.3" text-anchor="middle" fill="var(--unomi-info)" font-size="11" font-weight="700">193</text>
    <text x="499" y="344" text-anchor="middle" fill="var(--unomi-text)" font-size="13" font-weight="700">Unomi 3</text>
    <text x="499" y="362" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">3.0.1</text>
  </g>
  <g class="fade" style="animation-delay:0.46s">
    <rect class="bar" style="animation-delay:0.46s" x="640" y="125.9" width="36" height="194.1" rx="4" fill="var(--unomi-primary)"/>
    <rect class="bar" style="animation-delay:0.51s" x="682" y="270.6" width="36" height="49.4" rx="4" fill="var(--unomi-info)"/>
    <text x="658" y="117.9" text-anchor="middle" fill="var(--unomi-primary-dark)" font-size="11" font-weight="700">2,118</text>
    <text x="700" y="262.6" text-anchor="middle" fill="var(--unomi-info)" font-size="11" font-weight="700">539</text>
    <text x="679" y="344" text-anchor="middle" fill="var(--unomi-text)" font-size="13" font-weight="700">Unomi 4.0</text>
    <text x="679" y="362" text-anchor="middle" fill="var(--unomi-text-muted)" font-size="11">4.0.0</text>
  </g>
  <g class="fade" style="animation-delay:.7s">
    <rect x="40" y="385" width="14" height="14" rx="3" fill="var(--unomi-primary)"/>
    <text x="62" y="396" fill="var(--unomi-text)" font-size="12">Unit @Test methods</text>
    <rect x="230" y="385" width="14" height="14" rx="3" fill="var(--unomi-info)"/>
    <text x="252" y="396" fill="var(--unomi-text)" font-size="12">Integration @Test methods</text>
    <text x="780" y="396" text-anchor="end" fill="var(--unomi-text-muted)" font-size="11">Unit methods ~62x since 1.x</text>
  </g>
</svg>
