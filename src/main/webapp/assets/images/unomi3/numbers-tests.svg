  <text class="fade" style="animation-delay:.12s" x="40" y="78" fill="var(--unomi-text-muted)" font-size="11">Unomi 1: 11 unit / 25 IT classes  |  Unomi 2: 12 unit / 44 IT classes  |  Unomi 3.0: 15 unit / 43 IT classes  |  Unomi 4.0: 66 unit / 63 IT classes</text>
